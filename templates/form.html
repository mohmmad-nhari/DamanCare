{% extends 'base.html' %}{% block content %}<div class="pagehead"><a href="{{url_for('detail',device_id=device.id) if device else url_for('index')}}">← العودة</a><h1>{{'تعديل الجهاز' if device else 'إضافة جهاز جديد'}}</h1><p>أدخل معلومات الجهاز وضمانه. يمكنك إرفاق صورة الفاتورة أو PDF.</p></div><form class="panel form" method="post" enctype="multipart/form-data"><div class="formgrid"><label>اسم الجهاز *<input name="name" required maxlength="100" value="{{device.name if device else ''}}" placeholder="مثال: MacBook Air"></label><label>الفئة *<select name="category"><option>لابتوب</option><option>جوال</option><option>شاشة</option><option>طابعة</option><option>أجهزة منزلية</option><option>أخرى</option></select></label><label>العلامة التجارية<input name="brand" value="{{device.brand if device else ''}}" placeholder="مثال: Apple"></label><label>تاريخ الشراء *<input type="date" name="purchased" required value="{{device.purchased if device else today}}"></label><label>تاريخ انتهاء الضمان *<input type="date" name="expires" required value="{{device.expires if device else ''}}"></label><label>الفاتورة (PDF أو صورة، حتى 5 MB)<input type="file" name="invoice" accept=".pdf,.png,.jpg,.jpeg,.webp"></label></div><label>ملاحظات<textarea name="notes" rows="4" placeholder="ملاحظات إضافية...">{{device.notes if device else ''}}</textarea></label><div class="actions"><button class="btn" type="submit">{{'حفظ التعديلات' if device else 'حفظ الجهاز'}}</button><a class="btn outline" href="{{url_for('index')}}">إلغاء</a></div></form>{% endblock %}
